 the previous lesson first','OK',false)}function popup(t,s,b,start=true){$('#app').insertAdjacentHTML('beforeend',`<div class="popcover"><div class="pop"><h2>${t}</h2><p>${s}</p><button class="shadowbtn" onclick="this.closest('.popcover').remove();${start?'startLesson(0,lessonNumber)':''}">${b}</button><p onclick="this.closest('.popcover').remove()" style="cursor:pointer;margin:17px 0 0">NOT NOW</p></div></div>`)}function leaderboard(){return topBar()+`<h1 class="screenhead">Ruby League</h1><div class="league">${['🥉','🥈','🥇','🛡️','🔴','💎'].map((x,i)=>`<span class="shield ${i===4?'active':''}">${x}</span>`).join('')}</div><div class="subhead" style="text-align:center">Top 10 advance to the next league · ⏳ 3 days</div>${leaderMoved?'<div class="toast">You moved up to 4th place! 🚀</div>':''}<div class="leaguezone">PROMOTION ZONE</div>${Array.from({length:30},(_,i)=>{let index=i+1;let name=leaderMoved&&index===4?'Sam Rivera':ranks[(leaderMoved&&index>=5&&index<=6)?index-2:i];if(leaderMoved&&index===6)name='Zoe';let isSam=name==='Sam Rivera';return `${index===24?'<div class="leaguezone red">DEMOTION ZONE</div>':''}<div class="leader ${isSam?'me':''}"><span style="width:20px">${index}</span><span class="avatar" style="background:hsl(${i*37%360} 64% 75%)">${name[0]}</span><span style="flex:1">${name}</span><span class="tiny">${isSam?xp.toLocaleString():Math.max(50,4750-i*157).toLocaleString()} XP</span></div>`}).join('')}`}
function quests(){let all=[['Earn 30 XP',questXP,30],['Get 10 in a row',Math.min(streakRight?streakRight:3,10),10],['Score 90% or higher in 2 lessons',1,2]];return topBar()+`<h1 class="screenhead">Daily Quests</h1><div class="subhead">Complete quests to earn rewards!</div>${all.map(([name,cur,max],i)=>`<div class="quest"><span class="chest">${cur>=max?'🎉':'🧰'}</span><div style="flex:1"><h3>${name}</h3><div class="track"><div class="fill" style="width:${100*cur/max}%"></div></div><div class="tiny" style="text-align:right;margin-top:5px">${cur}/${max}</div></div></div>`).join('')}<h1 class="screenhead">Monthly Challenge</h1><div class="quest">🏅 <div><strong>Learn something every day!</strong><p class="tiny">Keep your learning streak alive.</p></div></div>`}function profile(){return topBar()+`<div class="profilehero"><div class="face">S</div><h1>Sam Rivera</h1><strong>@SamRivera927</strong><p class="tiny">Joined March 2025</p></div><h2 style="padding-left:20px">Statistics</h2><div class="statgrid">${[['🔥',streak+'','Day streak'],['⚡',xp.toLocaleString(),'Total XP'],['🛡️','Ruby','Current league'],['🏆','2','Top 3 finishes']].map(([e,n,t])=>`<div class="stat">${e} ${n}<small>${t}</small></div>`).join('')}</div><h2 style="padding-left:20px">Achievements</h2>${[['🔥','Wildfire',streak,30],['📚','Sage',xp,5000],['🎓','Scholar',214,250]].map(([e,n,v,m])=>`<div class="achievement"><h3>${e} ${n}</h3><div class="track"><div class="fill" style="width:${100*v/m}%"></div></div><div class="tiny" style="margin-top:7px">${v.toLocaleString()}/${m.toLocaleString()}</div></div>`).join('')}`}
function startLesson(at=0,lesson=lessonNumber){lessonNumber=lesson;EX=LESSONS[lessonNumber].exercises;lessonIndex=at;streakRight=0;energy=25;selected=[];picked=null;match=[];matching=[];feedback=false;wrong=false;setPage('lesson')}function lessonTop(){let percentage=Math.round(100*(lessonIndex)/7);return `<div class="lessonbar"><button class="x" onclick="exitLesson()">×</button><div class="progress"><div class="progressinside ${streakRight>=3?'fire':''}" style="width:${percentage}%"></div></div><span class="lessonenergy">▰ϟ ${energy}</span></div>`}function exitLesson(){if(demo)return;popupLessonExit()}function popupLessonExit(){$('#app').insertAdjacentHTML('beforeend',`<div class="popcover"><div class="pop"><h2>Quit this lesson?</h2><p>You'll lose your progress.</p><button class="shadowbtn" onclick="this.closest('.popcover').remove();setPage('learn')">QUIT</button><p onclick="this.closest('.popcover').remove()" style="cursor:pointer">KEEP LEARNING</p></div></div>`)}function cardMarkup(index){let q=EX[index];if(!q)return '';let body='';if(q.kind==='image')body=`<div class="promptrow"><button class="speaker" onclick="speak('${q.phrase}')">🔊</button><strong>${q.phrase}</strong></div><div class="pictures">${q.items.map(([emoji,name],i)=>`<button class="picture ${picked===i?'selected':''}" onclick="selectPicture(${i})"><span class="emoji">${emoji}</span>${name}</button>`).join('')}</div>`;if(q.kind==='choice')body=`<div class="speech" style="margin-bottom:20px">${q.phrase}</div><div class="options">${q.choices.map((c,i)=>`<button class="option ${picked===i?'selected':''}" onclick="selectPicture(${i})">${c}</button>`).join('')}</div>`;if(q.kind==='words')body=`<div class="promptrow">${owl()}<div class="speech"><button class="speaker" onclick="speak('${q.phrase.replaceAll("'",'')}')">🔊</button><br><span style="text-decoration:underline dotted #bdbdbd;text-underline-offset:8px">${q.phrase}</span></div></div><div class="answer" id="answer">${selected.map((id,i)=>`<button class="chip answerchip" data-chip="${id}" onclick="returnChip(${id})">${q.bank[id]}</button>`).join('')}</div><div class="bank">${q.bank.map((w,i)=>`<button class="chip ${selected.includes(i)?'slot':''}" data-bank="${i}" onclick="addChip(${i})">${selected.includes(i)?'&nbsp;':w}</button>`).join('')}</div>`;if(q.kind==='pairs')body=`<p class="tiny">Match Hindi adverbs with their meanings</p><div class="pairs">${q.pairs.flatMap(([a,b],i)=>[[a,i,0],[b,i,1]]).sort((a,b)=>a[2]-b[2]||a[1]-b[1]).map(([name,id,side])=>`<button class="pair ${matching.includes(id+'-'+side)?'done':''} ${match.some(p=>p.id===id&&p.side===side)?'selected':''}" onclick="pickPair(${id},${side})">${name}</button>`).join('')}</div>`;return `<div class="exercise active" data-ex="${index}"><h2>${q.title}</h2>${body}</div>`}function lesson(){return `<div class="lessonpage">${lessonTop()}<div class="exerciseport" id="exerciseport">${cardMarkup(lessonIndex)}</div><div class="lessonbottom"><button id="check" class="shadowbtn ${hasAnswer()?'':'gray'}" onclick="checkAnswer()">CHECK</button></div><div id="feedback" class="feedback"></div></div>`}function hasAnswer(){let q=EX[lessonIndex];return q?.kind==='pairs'?matching.length===10:q?.kind==='words'?selected.length>0:picked!==null}function updateCheck(){let b=$('#check');if(b){b.classList.toggle('gray',!hasAnswer());b.disabled=!hasAnswer()}}function selectPicture(i){if(feedback)return;picked=i;$$('.picture,.option').forEach((e,j)=>e.classList.toggle('selected',i===j));updateCheck();haptic()}function flyChip(from,to,text,doneFn){if(!from||!to){doneFn();return}let a=from.getBoundingClientRect(),b=to.getBoundingClientRect();let f=document.createElement('button');f.className='chip flying';f.textContent=text;f.style.left=a.left+'px';f.style.top=a.top+'px';f.style.width=a.width+'px';f.style.height=a.height+'px';document.body.appendChild(f);let dx=b.left-a.left,dy=b.top-a.top;requestAnimationFrame(()=>{f.style.transform=`translate(${dx}px,${dy}px)`});setTimeout(()=>{f.remove();doneFn()},305)}function addChip(i){if(feedback||selected.includes(i))return;let source=$(`[data-bank="${i}"]`),rect=source?.getBoundingClientRect();selected.push(i);let root=$('.exercise.active');if(!root)return;let line=$('#answer');let dest=document.createElement('button');dest.className='chip answerchip';dest.textContent=EX[lessonIndex].bank[i];dest.style.visibility='hidden';line.appendChild(dest);source.classList.add('slot');source.innerHTML='&nbsp;';flyChip(source,dest,EX[lessonIndex].bank[i],()=>{dest.style.visibility='visible';dest.onclick=()=>returnChip(i)});updateCheck();haptic()}function returnChip(i){if(feedback)return;let a=$(`[data-chip="${i}"]`),b=$(`[data-bank="${i}"]`),word=EX[lessonIndex].bank[i];if(!a||!b)return;a.style.visibility='hidden';flyChip(a,b,word,()=>{selected=selected.filter(x=>x!==i);a.remove();b.classList.remove('slot');b.textContent=word;updateCheck()});haptic()}function pickPair(id,side){if(feedback||matching.includes(id+'-'+side))return;let p={id,side};match.push(p);if(match.length===2){let [a,b]=match;if(a.id===b.id&&a.side!==b.side){matching.push(a.id+'-'+a.side,b.id+'-'+b.side);streakRight=matching.length/2}else{let targets=$$('.pair');targets.forEach(el=>el.classList.add('shake'));setTimeout(()=>targets.forEach(el=>el.classList.remove('shake')),260)}match=[]}$$('.pair').forEach(el=>{let pairs=EX[lessonIndex].pairs;let entry=pairs.findIndex(x=>x.includes(el.textContent));let part=pairs[entry]?.[0]===el.textContent?0:1;el.classList.toggle('done',matching.includes(entry+'-'+part));el.classList.toggle('selected',match.some(p=>p.id===entry&&p.side===part))});updateCheck();haptic()}function checkAnswer(forceRight){if(feedback||(!hasAnswer()&&!forceRight))return;energy=Math.max(0,energy-1);let q=EX[lessonIndex];let result=q.kind==='words'?selected.map(i=>q.bank[i]).join(' ')===q.answer.join(' '):q.kind==='pairs'?matching.length===10:picked===q.correct;if(forceRight!==undefined)result=forceRight;wrong=!result;feedback=true;streakRight=result?streakRight+1:0;$('.lessonenergy').textContent='▰ϟ '+energy;let bar=$('.progressinside');bar.classList.toggle('fire',streakRight>=3);bar.style.width=Math.round(100*(lessonIndex+1)/7)+'%';let solution=q.kind==='words'?q.answer.join(' '):q.kind==='choice'?q.choices[q.correct]:q.kind==='image'?q.items[q.correct][1]:'All matching pairs';let banner=$('#feedback');banner.className='feedback '+(result?'':'wrong');banner.innerHTML=`<h2>${result?'✅ '+(lessonIndex===6?'Amazing!':streakRight>2?'Great job!':'Nice job!'):'Correct solution:'}</h2><p>${result?'You got it right!':solution}</p><button class="shadowbtn ${result?'':'blue'}" onclick="continueLesson()">${result?'CONTINUE':'GOT IT'}</button>`;requestAnimationFrame(()=>banner.classList.add('show'));if(!result)$$('.selected').forEach(x=>x.classList.add('shake'));haptic()}function continueLesson(){if(!feedback||slideBusy)return;haptic();let banner=$('#feedback');banner.classList.remove('show');feedback=false;if(lessonIndex===6){setTimeout(()=>setPage('complete'),180);return}slideBusy=true;let old=$('.exercise.active');lessonIndex++;selected=[];picked=null;match=[];matching=[];let port=$('#exerciseport');let temp=document.createElement('div');temp.innerHTML=cardMarkup(lessonIndex);let next=temp.firstElementChild;next.classList.remove('active');port.appendChild(next);requestAnimationFrame(()=>requestAnimationFrame(()=>{old.classList.add('slide','toleft');old.classList.remove('active');next.classList.add('slide','active')}));setTimeout(()=>{old.remove();slideBusy=false;updateCheck()},270)}function complete(){return `<div class="complete">${owl('cheer')}<h1>Lesson complete!</h1><div class="statboxes"><div class="statbox"><header style="background:#ffc800">TOTAL XP</header><p id="xpcount">15</p></div><div class="statbox"><header style="background:#58cc02">AMAZING</header><p>86%</p></div><div class="statbox"><header style="background:#1cb0f6">SPEEDY</header><p>2:14</p></div></div><button style="width:100%" class="shadowbtn" onclick="claimXP()">CLAIM XP</button></div>`}function claimXP(){haptic();xp+=15;questXP=Math.min(30,questXP+15);leaderMoved=true;setPage('streak')}function streakScreen(){return `<div class="complete"><div style="display:flex;align-items:center">${owl('cheer')}<div class="streakflame">🔥</div></div><div class="streaknumber" id="streaknum">27</div><h1 style="margin:0">day streak</h1><div class="weekdayrow">${['Su','Mo','Tu','We','Th','Fr','Sa'].map((v,i)=>`<span>${v}<i id="circle${i}" class="circle">✓</i></span>`).join('')}</div><div class="streaksay">${owl('wave')}<p>Keep it up! I'm off to brag about your streak.</p></div><button class="shadowbtn" style="width:100%" onclick="finishLesson()">CONTINUE</button></div>`}function animateStreak(){let num=$('#streaknum');if(!num)return;setTimeout(()=>{num.textContent='28';num.style.transform='scale(1.15)';setTimeout(()=>num.style.transform='',180)},300);[0,1,2,3,4,5,6].forEach((i)=>setTimeout(()=>{$('#circle'+i)?.classList.add('checked')},450+i*65))}function finishLesson(){streak=28;done=Math.max(done,Math.min(LESSONS.length,lessonNumber+1));current=done;setPage('learn')}function speak(text){try{if(!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';speechSynthesis.speak(u)}catch(e){}}function render(){let main=$('#main');main.className=['lesson','complete','streak'].includes(page)?'lessonMode':'';main.innerHTML=page==='learn'?learn():page==='leader'?leaderboard():page==='quests'?quests():page==='profile'?profile():page==='lesson'?lesson():page==='complete'?complete():streakScreen();$('#nav').style.display=['lesson','complete','streak'].includes(page)?'none':'';$('#nav').innerHTML=tabs();let flag=$('#flag');if(flag){let t;flag.onpointerdown=()=>{t=setTimeout(reset,650)};flag.onpointerup=flag.onpointerleave=()=>clearTimeout(t)}if(page==='streak')animateStreak();if(page==='lesson')updateCheck()}function reset(){demoTimers.forEach(clearTimeout);demo=false;current=0;done=0;lessonNumber=0;EX=LESSONS[0].exercises;energy=25;gems=505;streak=27;xp=4120;questXP=15;leaderMoved=false;startLesson(0);setPage('learn')}function later(ms,fn){demoTimers.push(setTimeout(fn,ms))}function runDemo(){demoTimers.forEach(clearTimeout);demo=true;lessonNumber=0;EX=LESSONS[0].exercises;page='lesson';lessonIndex=5;selected=[0,1];picked=null;matching=[];streakRight=4;energy=21;feedback=false;render();later(400,()=>{let q=EX[lessonIndex];q.answer.forEach(w=>{let i=q.bank.indexOf(w);if(i>=0&&!selected.includes(i))addChip(i)})});later(1000,()=>checkAnswer(true));later(1400,()=>continueLesson());later(1750,()=>{let q=EX[lessonIndex];q.answer.forEach(w=>{let i=q.bank.indexOf(w);if(i>=0&&!selected.includes(i))addChip(i)})});later(2320,()=>checkAnswer(true));later(2750,()=>continueLesson());later(3300,()=>claimXP());later(4250,()=>{demo=false})}render();
</script></body></html>
