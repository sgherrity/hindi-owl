  let lang=q.direction==='toHindi'?'English → Hindi':'Hindi → English';body=`<div class="promptrow">${owl()}<div class="speech"><span class="prompttag">${lang}</span><p>${escapeHTML(q.phrase)}</p></div></div><div class="answer" id="answer">${selected.map(id=>`<button class="chip answerchip" data-chip="${id}" onclick="returnChip(${id})" aria-label="Remove ${escapeHTML(q.bank[id])}">${escapeHTML(q.bank[id])}</button>`).join('')}</div><div class="bank">${q.bank.map((word,j)=>`<button class="chip ${selected.includes(j)?'slot':''}" data-bank="${j}" onclick="addChip(${j})" aria-label="Add ${escapeHTML(word)}">${selected.includes(j)?'&nbsp;':escapeHTML(word)}</button>`).join('')}</div>`;
}else if(q.kind==='pairs'){
  const pairs=q.pairs;let a=pairs.map((p,j)=>[p[0],j,0]),b=pairs.map((p,j)=>[p[1],j,1]);let orderA=[...a].sort((x,y)=>((x[1]*3+i)%7)-((y[1]*3+i)%7));let orderB=[...b].sort((x,y)=>((x[1]*5+i+2)%7)-((y[1]*5+i+2)%7));let make=(item)=>{let [t,id,side]=item,k=id+'-'+side;return `<button class="pair ${matched.includes(k)?'done':''} ${matchFirst===k?'selected':''}" onclick="pickPair(${id},${side})">${escapeHTML(t)}</button>`};body=`<p class="tiny">Match each romanized Hindi word with its English meaning.</p><div class="pairs twocol"><div>${orderA.map(make).join('')}</div><div>${orderB.map(make).join('')}</div></div>`;
}return `<div class="exercise active" data-ex="${i}"><h2>${title}</h2>${body}</div>`}
function lesson(){return `<div class="lessonpage">${lessonTop()}<div class="exerciseport" id="exerciseport">${cardMarkup(lessonIndex)}</div><div class="lessonbottom"><button class="shadowbtn ${hasAnswer()?'':'gray'}" id="check" onclick="checkAnswer()" ${hasAnswer()?'':'disabled'}>CHECK</button></div><div class="feedback" id="feedback"></div></div>`}
function hasAnswer(){let q=EX[lessonIndex];return q?.kind==='pairs'?matched.length===q.pairs.length*2:q?.kind==='words'?selected.length>0:picked!==null}
function updateCheck(){let el=$('#check');if(!el)return;let ready=hasAnswer()&&chipInFlight.size===0&&!feedback;el.classList.toggle('gray',!ready);el.disabled=!ready}
function pickChoice(i){if(feedback)return;picked=i;$$('.option').forEach((el,j)=>el.classList.toggle('selected',i===j));updateCheck();saveDraft();haptic()}
function flyChip(from,to,text,done){if(!from||!to){done();return}let a=from.getBoundingClientRect(),b=to.getBoundingClientRect();let flying=document.createElement('div');flying.className='chip flying';flying.textContent=text;flying.style.left=a.left+'px';flying.style.top=a.top+'px';flying.style.width=a.width+'px';flying.style.height=a.height+'px';document.body.append(flying);requestAnimationFrame(()=>requestAnimationFrame(()=>{flying.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px)`}));setTimeout(()=>{flying.remove();done()},305)}
function addChip(i){let q=EX[lessonIndex];if(feedback||slideBusy||q.kind!=='words'||selected.includes(i)||chipInFlight.has(i))return;let src=$(`[data-bank="${i}"]`),line=$('#answer');if(!src||!line)return;let word=q.bank[i];selected.push(i);chipInFlight.add(i);let dest=document.createElement('button');dest.className='chip answerchip';dest.dataset.chip=i;dest.setAttribute('aria-label','Remove '+word);dest.textContent=word;dest.style.visibility='hidden';dest.onclick=()=>returnChip(i);line.appendChild(dest);src.classList.add('slot');src.innerHTML='&nbsp;';updateCheck();saveDraft();flyChip(src,dest,word,()=>{if(dest.isConnected)dest.style.visibility='visible';chipInFlight.delete(i);updateCheck()});haptic()}
function returnChip(i){let q=EX[lessonIndex];if(feedback||slideBusy||q.kind!=='words'||chipInFlight.has(i)||!selected.includes(i))return;let src=$(`[data-chip="${i}"]`),dest=$(`[data-bank="${i}"]`);if(!src||!dest)return;let word=q.bank[i];selected=selected.filter(x=>x!==i);chipInFlight.add(i);updateCheck();saveDraft();flyChip(src,dest,word,()=>{if(dest.isConnected){dest.classList.remove('slot');dest.textContent=word}chipInFlight.delete(i);updateCheck()});src.remove();haptic()}
function pickPair(id,side){if(feedback)return;let k=id+'-'+side;if(matched.includes(k))return;if(matchFirst===null){matchFirst=k}else{let [a,b]=matchFirst.split('-').map(Number);if(a===id&&b!==side){matched.push(matchFirst,k);$$('.pair').forEach(el=>el.classList.remove('shake'))}else{$$('.pair').forEach(el=>{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),260)})}matchFirst=null}$$('.pair').forEach(el=>{let args=el.getAttribute('onclick')||'';let m=args.match(/pickPair\((\d+),(\d+)\)/);if(m){let key=m[1]+'-'+m[2];el.classList.toggle('done',matched.includes(key));el.classList.toggle('selected',matchFirst===key)}});updateCheck();saveDraft();haptic()}
function solution(q){return q.kind==='words'?q.answer.join(' '):q.kind==='pairs'?'All four pairs':q.choices[q.correct]}
function checkAnswer(force){if(feedback||chipInFlight.size||(!hasAnswer()&&force===undefined))return;let q=EX[lessonIndex];let ok=q.kind==='words'?selected.map(i=>q.bank[i]).join(' ')===q.answer.join(' '):q.kind==='pairs'?matched.length===q.pairs.length*2:picked===q.correct;if(force!==undefined)ok=force;feedback=true;wrong=!ok;if(!demo){state.energy=Math.max(0,state.energy-1);state.totalChecks++;if(ok){state.totalCorrect++;rightCount++}combo=ok?combo+1:0;state.bestCombo=Math.max(state.bestCombo,combo);store()}else{combo=ok?combo+1:0;rightCount+=ok?1:0}
 let bar=$('.progressinside');bar.style.width=Math.round((lessonIndex+1)/7*100)+'%';bar.classList.toggle('fire',combo>=3);$('.lessonenergy').textContent='💗 '+state.energy;let banner=$('#feedback');banner.className='feedback '+(ok?'':'wrong');banner.innerHTML=`<h2>${ok?(lessonIndex===6?'✨ Amazing!':combo>=3?'🔥 Great job!':'✅ Nice job!'):'Correct solution:'}</h2><p>${ok?'Excellent work!':escapeHTML(solution(q))}</p><button class="shadowbtn ${ok?'':'redbtn'}" onclick="continueLesson()">${ok?'CONTINUE':'GOT IT'}</button>`;requestAnimationFrame(()=>banner.classList.add('show'));if(!ok)$$('.option.selected,.chip.answerchip').forEach(el=>{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300)});haptic()}
function continueLesson(){if(!feedback||slideBusy)return;let banner=$('#feedback');banner.classList.remove('show');feedback=false;haptic();if(lessonIndex===6){setTimeout(()=>{if(demo)state.energy=21;lastScore=Math.round(rightCount/7*100);page='complete';render()},175);return}slideBusy=true;let old=$('.exercise.active');lessonIndex++;selected=[];picked=null;matchFirst=null;matched=[];chipInFlight.clear();saveDraft();let port=$('#exerciseport'),tmp=document.createElement('div');tmp.innerHTML=cardMarkup(lessonIndex);let newCard=tmp.firstElementChild;newCard.classList.remove('active');port.appendChild(newCard);requestAnimationFrame(()=>requestAnimationFrame(()=>{old.classList.add('slide','toleft');old.classList.remove('active');newCard.classList.add('slide','active')}));setTimeout(()=>{old.remove();slideBusy=false;updateCheck();const pb=$('.progressinside');pb.style.width=Math.round(lessonIndex/7*100)+'%'},260)}
function complete(){return `<div class="complete">${owl('cheer')}<h1>Lesson complete!</h1><p class="completecaption">${escapeHTML(lessons[lessonNumber].title)}</p><div class="statboxes"><div class="statbox"><header style="background:var(--gold)">TOTAL XP</header><p id="xpcount">15</p></div><div class="statbox"><header style="background:var(--green)">ACCURACY</header><p>${lastScore}%</p></div><div class="statbox"><header style="background:var(--blue)">SPEEDY</header><p>${Math.floor((Date.now()-lessonStart)/60000)}:${String(Math.floor((Date.now()-lessonStart)/1000)%60).padStart(2,'0')}</p></div></div><button class="shadowbtn" style="width:100%" onclick="claimXP()">CLAIM XP</button></div>`}
function todayKey(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function claimXP(){haptic();if(!demo){state.xp+=15;state.todayXP+=15;if(lastScore>=90)state.highScores++;const id=lessons[lessonNumber].id;if(!state.completed.includes(id))state.completed.push(id);const today=todayKey();if(state.lastStreakDay!==today){state.streak++;state.lastStreakDay=today}state.inProgress=null;store()}else{state.streak=28}page='streak';render()}
function streakScreen(){return `<div class="complete"><div class="streakhero">${owl('cheer')}<div class="streakflame">🔥</div></div><div class="streaknumber" id="streaknum">${demo?'27':state.streak-1}</div><h1 style="margin:0">day streak</h1><div class="weekdayrow">${['Su','Mo','Tu','We','Th','Fr','Sa'].map((name,i)=>`<span>${name}<i id="circle${i}" class="circle">✓</i></span>`).join('')}</div><div class="streaksay">Keep it up! I'm off to brag about your streak.</div><button class="shadowbtn" style="width:100%" onclick="finishLesson()">CONTINUE</button></div>`}
function animateStreak(){let e=$('#streaknum');if(!e)return;setTimeout(()=>{e.textContent=state.streak;e.style.transform='scale(1.16)';setTimeout(()=>e.style.transform='',200)},300);Array.from({length:7},(_,i)=>i).forEach((i)=>setTimeout(()=>$('#circle'+i)?.classList.add('checked'),450+i*60))}
function finishLesson(){if(demo){demo=false;state=load()}activeUnit=unitOfLesson(nextIndex());page='learn';render();haptic()}
function render(){const main=$('#main');main.className=['lesson','complete','streak'].includes(page)?'lessonMode':'';main.innerHTML=page==='learn'?learn():page==='leader'?leaderboard():page==='quests'?quests():page==='profile'?profile():page==='lesson'?lesson():page==='complete'?complete():streakScreen();const nav=$('#nav');nav.style.display=['lesson','complete','streak'].includes(page)?'none':'';nav.innerHTML=tabs();let flag=$('#flag');if(flag){let timer;flag.onpointerdown=()=>timer=setTimeout(reset,700);flag.onpointerup=flag.onpointerleave=()=>clearTimeout(timer);flag.oncontextmenu=e=>e.preventDefault()}if(page==='lesson')updateCheck();if(page==='streak')animateStreak();if(page==='learn'){let strip=$('.unitstrip'),chosen=$('.unitpill.chosen');if(strip&&chosen)strip.scrollLeft=Math.max(0,chosen.offsetLeft-strip.offsetLeft-120)}}
function reset(){demoTimers.forEach(clearTimeout);demo=false;try{localStorage.removeItem(KEY)}catch(e){}state=initial();page='learn';activeUnit=0;lessonNumber=0;render();haptic()}
function later(ms,fn){demoTimers.push(setTimeout(fn,ms))}
function demoPlace(words){let q=EX[lessonIndex];words.forEach((w,i)=>{later(i*135,()=>{let idx=q.bank.findIndex((x,j)=>x===w&&!selected.includes(j));if(idx>=0)addChip(idx)})})}
function runDemo(){demoTimers.forEach(clearTimeout);closePopup();demo=true;state={...load(),energy:21,streak:27};lessonNumber=Math.min(nextIndex(),TOTAL-1);let a={kind:'words',title:'Translate into English',phrase:'Mujhe thodi chai chahiye',direction:'toEnglish',bank:['tea','milk','I','some','water','want'],answer:['I','want','some','tea']};let b={kind:'words',title:'Translate into English',phrase:'Mujhe coffee pasand hai',direction:'toEnglish',bank:['coffee','I','she','like','water'],answer:['I','like','coffee']};EX=Array.from({length:5},()=>a).concat([a,b]);page='lesson';lessonIndex=5;selected=[a.bank.indexOf('I'),a.bank.indexOf('want')];picked=null;matched=[];combo=4;rightCount=5;feedback=false;slideBusy=false;chipInFlight.clear();lessonStart=Date.now()-134000;render();later(400,()=>demoPlace(['some','tea']));later(1000,()=>checkAnswer(true));later(1400,continueLesson);later(1750,()=>demoPlace(['I','like','coffee']));later(2320,()=>checkAnswer(true));later(2750,continueLesson);later(3300,claimXP);later(4300,()=>{demo=false;state=load()})}
render();

if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
